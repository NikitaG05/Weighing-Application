spring.application.name=weighbridge
server.port=8081

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/WeighbridgeCloudTest
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Create/update tables during local development
spring.jpa.hibernate.ddl-auto=update

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=weighbridge-api

# React frontend
app.frontend.origin=http://localhost:3000

app.reports.export-directory=D:/API