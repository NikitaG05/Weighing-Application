spring.application.name=weighbridge
server.port=${PORT:8081}

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/WeighbridgeCloudTest}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Create/update tables during local development
spring.jpa.hibernate.ddl-auto=update

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=weighbridge-api

# React frontend
app.frontend.origin=http://localhost:3000

app.reports.export-directory=${REPORT_EXPORT_DIR:/tmp/tarex-reports}

app.jwt.expiration-seconds=28800

# Include error details for debugging
server.error.include-message=always
server.error.include-binding-errors=always

app.activation.private-key=${ACTIVATION_PRIVATE_KEY}
# TareX CCTV Image Storage - Supabase
app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.supabase.bucket=tarex-weighment-images

# Image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
