
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    image: tarex-backend:1.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

      TAREX_BOOTSTRAP_ENABLED: ${TAREX_BOOTSTRAP_ENABLED}
      TAREX_BOOTSTRAP_USERNAME: ${TAREX_BOOTSTRAP_USERNAME}
      TAREX_BOOTSTRAP_PASSWORD: ${TAREX_BOOTSTRAP_PASSWORD}
      TAREX_BOOTSTRAP_FULL_NAME: ${TAREX_BOOTSTRAP_FULL_NAME}
      TAREX_BOOTSTRAP_MOBILE: ${TAREX_BOOTSTRAP_MOBILE}
      TAREX_BOOTSTRAP_EMAIL: ${TAREX_BOOTSTRAP_EMAIL}

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../new-app
      dockerfile: Dockerfile
    image: tarex-frontend:1.0
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
